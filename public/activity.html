<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity Log - Student Helpdesk</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app-navbar"></div>
<div class="container pb-5">
  <h4 class="mb-3">Activity Log</h4>

  <form id="filterForm" class="row g-2 mb-3">
    <div class="col-6 col-md-3">
      <select id="filterEntityType" class="form-select">
        <option value="">All Types</option>
        <option value="ticket">Tickets</option>
        <option value="user">Users</option>
        <option value="category">Categories</option>
      </select>
    </div>
    <div class="col-6 col-md-3">
      <select id="filterAction" class="form-select">
        <option value="">All Actions</option>
        <option value="create">Create</option>
        <option value="update">Update</option>
        <option value="delete">Delete</option>
        <option value="comment">Comment</option>
      </select>
    </div>
    <div class="col-6 col-md-4">
      <input type="text" id="filterSearch" class="form-control" placeholder="Search message or actor...">
    </div>
    <div class="col-12 col-md-2 d-flex gap-2">
      <button type="submit" class="btn btn-outline-primary flex-fill">Filter</button>
      <button type="button" id="clearFiltersBtn" class="btn btn-outline-secondary">Clear</button>
    </div>
  </form>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover table-stack align-middle mb-0">
        <thead><tr><th>Time</th><th>Actor</th><th>Type</th><th>Message</th></tr></thead>
        <tbody id="activityTableBody"></tbody>
      </table>
    </div>
  </div>
  <p class="text-muted small mt-2">Showing the most recent 200 matching entries.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/activity.js"></script>
</body>
</html>
