<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categories - Student Helpdesk</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app-navbar"></div>
<div class="container pb-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Category Management</h4>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
      <i class="bi bi-plus-lg"></i> Add Category
    </button>
  </div>
  <p class="text-muted small">
    The category named exactly <strong>Physics Lab Equipment Borrowing</strong> triggers the equipment
    borrowing fields on the New Ticket form. Renaming or deleting it will disable that behavior for new tickets.
  </p>
  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>Name</th><th>Tickets Using It</th><th>Actions</th></tr></thead>
        <tbody id="categoriesTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="addCategoryModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="addCategoryForm">
        <div class="modal-header">
          <h5 class="modal-title">Add Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="addCategoryError" class="alert alert-danger d-none"></div>
          <div class="mb-3">
            <label class="form-label">Category Name</label>
            <input type="text" id="newCategoryName" class="form-control" placeholder="e.g., Library Services" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Create Category</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/categories.js"></script>
</body>
</html>
