<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In - Student Helpdesk</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <button class="btn btn-sm btn-outline-secondary position-fixed top-0 end-0 m-3" id="themeToggleBtn" title="Toggle light/dark theme"></button>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-8 col-md-5 col-lg-4">
        <div class="card shadow-sm mt-5">
          <div class="card-body p-4">
            <h3 class="text-center mb-1">Student Helpdesk</h3>
            <p class="text-center text-muted mb-4">Sign in to continue</p>
            <div id="alertBox" class="alert alert-danger d-none"></div>
            <div id="resendBox" class="alert alert-warning d-none d-flex justify-content-between align-items-center gap-2">
              <span>Didn't get the email?</span>
              <button type="button" class="btn btn-sm btn-outline-dark">Resend verification email</button>
            </div>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>
            <p class="text-center mt-3 mb-0">
              New student? <a href="/register.html">Create an account</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
