<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports - Student Helpdesk</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app-navbar"></div>
<div class="container pb-5">
  <h4 class="mb-3">Reports</h4>
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card text-center"><div class="card-body"><div class="display-6" id="statTotal">0</div><div class="text-muted">Total Tickets</div></div></div>
    </div>
    <div class="col-md-4">
      <div class="card text-center"><div class="card-body"><div class="display-6" id="statUnassigned">0</div><div class="text-muted">Unassigned (Open)</div></div></div>
    </div>
    <div class="col-md-4">
      <div class="card text-center"><div class="card-body"><div class="display-6" id="statAvgResolution">0</div><div class="text-muted">Avg Resolution Time</div></div></div>
    </div>
  </div>
  <div class="row mb-4">
    <div class="col-md-6 mb-3"><div class="card"><div class="card-body"><h6>By Status</h6><canvas id="statusChart"></canvas></div></div></div>
    <div class="col-md-6 mb-3"><div class="card"><div class="card-body"><h6>By Priority</h6><canvas id="priorityChart"></canvas></div></div></div>
  </div>
  <div class="row mb-4">
    <div class="col-md-6 mb-3"><div class="card"><div class="card-body"><h6>By Category</h6><canvas id="categoryChart"></canvas></div></div></div>
    <div class="col-md-6 mb-3"><div class="card"><div class="card-body"><h6>Tickets (Last 14 Days)</h6><canvas id="trendChart"></canvas></div></div></div>
  </div>
  <div class="card">
    <div class="card-body">
      <h6>Admin Workload</h6>
      <div id="adminWorkload"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/reports.js"></script>
</body>
</html>
