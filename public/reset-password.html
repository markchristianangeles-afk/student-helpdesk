<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password - Student Helpdesk</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <button class="btn btn-sm btn-outline-secondary position-fixed top-0 end-0 m-3" id="themeToggleBtn" title="Toggle light/dark theme"></button>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-8 col-md-5 col-lg-4">
        <div class="card shadow-sm mt-5">
          <div class="card-body p-4">
            <h3 class="text-center mb-1">Reset Password</h3>
            <p class="text-center text-muted mb-4">Choose a new password</p>
            <div id="alertBox" class="alert alert-danger d-none"></div>
            <form id="resetForm">
              <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" id="password" class="form-control" required minlength="6">
              </div>
              <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input type="password" id="confirmPassword" class="form-control" required minlength="6">
              </div>
              <button type="submit" class="btn btn-primary w-100">Reset Password</button>
            </form>
            <p class="text-center mt-3 mb-0">
              <a href="/index.html">Back to sign in</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
