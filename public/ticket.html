<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Detail - Student Helpdesk</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app-navbar"></div>
<div class="container pb-5" id="ticketContent">
  <a href="/tickets.html" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back to Tickets</a>
  <div class="card mb-4">
    <div class="card-body">
      <h4 id="ticketSubject"></h4>
      <div id="ticketMeta" class="mb-2"></div>
      <p id="ticketDescription" class="mb-3"></p>

      <div id="equipmentDetails" class="d-none mb-3">
        <hr>
        <h6>Equipment Details</h6>
        <div class="table-responsive">
          <table class="table table-sm table-borderless w-auto mb-0">
            <tbody>
              <tr>
                <th class="text-muted fw-normal pe-4">Item</th>
                <td id="equipmentDetailName" class="fw-semibold"></td>
              </tr>
              <tr>
                <th class="text-muted fw-normal pe-4">Quantity</th>
                <td id="equipmentDetailQuantity" class="fw-semibold"></td>
              </tr>
              <tr>
                <th class="text-muted fw-normal pe-4">Borrow Date</th>
                <td id="equipmentDetailBorrow" class="fw-semibold"></td>
              </tr>
              <tr>
                <th class="text-muted fw-normal pe-4">Return Date</th>
                <td id="equipmentDetailReturn" class="fw-semibold"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="row small text-muted">
        <div class="col-md-3">Submitted by: <span id="ticketSubmitter"></span></div>
        <div class="col-md-3">Section: <span id="ticketSection"></span></div>
        <div class="col-md-3">Assigned to: <span id="ticketAssignee"></span></div>
        <div class="col-md-3">Created: <span id="ticketCreated"></span></div>
      </div>
    </div>
  </div>

  <div class="card mb-4 d-none" id="staffControls">
    <div class="card-body">
      <h6>Manage Ticket</h6>
      <div class="row g-2 align-items-end">
        <div class="col-md-3">
          <label class="form-label">Status</label>
          <select id="statusSelect" class="form-select">
            <option value="open">Open</option>
            <option value="in_progress">In Progress</option>
            <option value="resolved">Resolved</option>
            <option value="closed">Closed</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Priority</label>
          <select id="prioritySelect" class="form-select">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Assign To</label>
          <select id="assigneeSelect" class="form-select"></select>
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary w-100" id="saveTicketBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h6>Comments</h6>
      <div id="commentsList" class="mb-3"></div>
      <form id="commentForm" class="d-flex gap-2">
        <input type="text" id="commentMessage" class="form-control" placeholder="Write a comment...">
        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/ticket-detail.js"></script>
</body>
</html>
